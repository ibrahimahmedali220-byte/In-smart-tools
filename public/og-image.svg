<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Brand Card Container -->
  <g transform="translate(100, 120)">
    <!-- Icon -->
    <rect width="72" height="72" rx="18" fill="#1e293b"/>
    <path d="M22 20a9 9 0 0 1 15.36-6.36l-5.43 5.43a3.37 3.37 0 0 0 4.77 4.77l5.43-5.43A9 9 0 0 1 35.77 33.65l-15.36 15.37a4.5 4.5 0 1 1-6.36-6.37l15.36-15.36A8.95 8.95 0 0 1 22 20z" fill="#ffffff"/>
    <circle cx="50" cy="50" r="5" fill="#38bdf8"/>

    <!-- Text Group -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="2">ALL-IN-ONE ONLINE UTILITY PLATFORM</text>
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Smartly Tools</text>
    <text x="0" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Simple, fast and free online utilities.</text>

    <!-- Category Tags -->
    <g transform="translate(0, 330)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#64748b">Finance Tools  ·  Student Tools  ·  Document Converters  ·  Everyday Utilities</text>
    </g>
  </g>
</svg>
